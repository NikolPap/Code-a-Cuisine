<div class="page-wrapper">
  
  <header class="top-header">
    <div class="header-left">
      <a routerLink="/" class="logo-link">
        <img src="/assets/images/logo.svg" alt="Code à Cuisine" class="logo-small" />
      </a>
      <a routerLink="/cookbook" class="back-link">
        <img src="/assets/images/arrow-left.svg" alt="back" /> Cookbook
      </a>
    </div>
    
    <button class="btn-dark-green" routerLink="/generate">Generate a recipe</button>
  </header>

  <!-- ΕΔΩ ΦΟΡΤΩΝΕΙ ΤΟ ΔΥΝΑΜΙΚΟ BANNER -->
  <div class="banner-container">
    <img [src]="'/assets/images/' + categoryBanner" alt="Category Banner" class="category-banner" />
  </div>

  <div class="recipe-list">
    <div class="list-row" *ngFor="let item of recipes; let i = index">
      
      <div class="row-left">
        <div class="number-circle">{{ i + 1 }}</div>
        
        <div class="row-info">
          <div class="time-info">
            <img src="/assets/images/clock.svg" alt="clock" /> Cooking time: {{ item.time }}
          </div>
          <h3 class="recipe-title" [routerLink]="['/recipe', item.id]">{{ item.title }}</h3>
        </div>
      </div>

      <div class="row-right">
        <span class="tag" *ngFor="let tag of item.tags">{{ tag }}</span>
        <span class="tag like-tag">
          <img src="/assets/images/favorite-small.svg" alt="likes"/> {{ item.likes }}
        </span>
      </div>

    </div>
  </div>

  <div class="pagination">
    <span class="page-arrow">&lt;</span>
    <span class="page-num active">1</span>
    <span class="page-num">2</span>
    <span class="page-num">3</span>
    <span class="page-dots">...</span>
    <span class="page-num">8</span>
    <span class="page-arrow">&gt;</span>
  </div>

</div>
